<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Auto Tool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    h1 {
      font-size: 20px;
      color: #667eea;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
      font-size: 14px;
    }
    
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    select:focus, input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button.secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    button.danger {
      background: #e74c3c;
    }
    
    .status {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    
    .status-label {
      color: #666;
    }
    
    .status-value {
      font-weight: bold;
      color: #667eea;
    }
    
    .queue-list {
      max-height: 150px;
      overflow-y: auto;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    
    .queue-item {
      padding: 8px;
      background: white;
      border-radius: 5px;
      margin-bottom: 5px;
      font-size: 12px;
      border-right: 3px solid #667eea;
    }
    
    .config-section {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .toggle-btn {
      background: #2ecc71;
    }
    
    .toggle-btn.paused {
      background: #f39c12;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Instagram Auto Tool</h1>
    
    <div class="section">
      <label for="actionType">نوع عملیات:</label>
      <select id="actionType">
        <option value="like">❤️ لایک</option>
        <option value="follow">➕ فالو</option>
        <option value="comment">💬 کامنت</option>
        <option value="scroll">📜 اسکرول</option>
      </select>
    </div>
    
    <div class="section" id="commentSection" style="display: none;">
      <label for="commentText">متن کامنت:</label>
      <input type="text" id="commentText" placeholder="متن کامنت خود را وارد کنید...">
    </div>
    
    <div class="config-section">
      <label for="delayBetweenActions">تاخیر بین عملیات (میلی‌ثانیه):</label>
      <input type="number" id="delayBetweenActions" value="3000" min="1000" step="500">
      
      <label for="autoScroll" style="margin-top: 10px;">اسکرول خودکار:</label>
      <select id="autoScroll">
        <option value="false">غیرفعال</option>
        <option value="true">فعال</option>
      </select>
    </div>
    
    <button id="startBtn">▶️ شروع عملیات</button>
    <button id="pauseBtn" class="toggle-btn">⏸️ توقف موقت</button>
    <button id="clearBtn" class="danger">🗑️ پاک کردن صف</button>
    
    <div class="status">
      <div class="status-item">
        <span class="status-label">وضعیت:</span>
        <span class="status-value" id="statusValue">در انتظار</span>
      </div>
      <div class="status-item">
        <span class="status-label">تعداد در صف:</span>
        <span class="status-value" id="queueLength">0</span>
      </div>
      <div class="queue-list" id="queueList">
        <!-- لیست صف -->
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
