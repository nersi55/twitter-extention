<!DOCTYPE html>
<html>
<head>
  <title>Browser Automation</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 10px; }
    button { margin: 5px 0; padding: 10px; width: 100%; }
  </style>
</head>
<body>
  <h3>Browser Automation</h3>
  <div>
    <label for="listUrl">List URL</label>
    <input id="listUrl" type="text" style="width:100%" value="https://x.com/i/lists/1591905950507716608">
  </div>
  <div>
    <label for="count">Count</label>
    <input id="count" type="number" min="1" max="50" value="5" style="width:100%">
  </div>
  <div>
    <label for="messages">Messages (one per line)</label>
    <textarea id="messages" rows="4" style="width:100%">[Sample reply]</textarea>
  </div>
  <button id="navigate">Navigate to Twitter</button>
  <button id="like">Like a Tweet</button>
  <button id="like5">Like 5 Tweets</button>
  <button id="repostList">Repost 5 from List</button>
  <button id="quoteList">Quote 5 from List</button>
  <script src="popup.js"></script>
</body>
</html>
